<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>검고담임 광고 영상 (EXPO)</title>
  <!-- 글꼴은 앱과 같은 Wanted Sans. 파일을 더블클릭해 열어도 되도록 CSS 안에 담았다 -->
  <link rel="stylesheet" href="assets/fonts/wanted-sans.css">
  <link rel="stylesheet" href="src/ad.css">
</head>
<body>
  <div id="viewport">
    <div id="stage" role="img" aria-label="검고담임 광고 영상 — 검정고시에서 대학까지"></div>
  </div>

  <!-- 미리보기 조작부: 광고 화면(1920×1080) 밖에 있고, 촬영 모드(?mode=capture)에서는 숨긴다 -->
  <div id="controls" hidden>
    <button type="button" data-a="play" aria-pressed="false">재생</button>
    <button type="button" data-a="restart">처음부터</button>
    <input type="range" data-a="range" min="0" max="50" step="0.01" value="0" aria-label="재생 위치">
    <span data-a="time">0.00 / 50.00초</span>
    <label><input type="checkbox" data-a="loop" checked> 반복</label>
    <button type="button" data-a="sound">🔇 소리와 함께 재생</button>
    <label>음량 <input type="range" data-a="vol" min="0" max="1" step="0.01" value="0.85" style="width:90px" aria-label="음량"></label>
    <button type="button" data-a="capture">촬영 모드 열기</button>
    <div class="scenes" data-a="scenes" aria-label="구간 이동"></div>
  </div>

  <script src="src/config.js"></script>
  <script src="assets/screens/screens.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/scenes.js"></script>
</body>
</html>
