<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA — 설치 가능하게 하고 안드로이드 상단바 색을 맞춘다 -->
    <meta name="theme-color" content="#2E8BD0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TalkDream" />
    <title>TalkDream — 가까운 꿈드림에 물어봐요</title>
    <meta
      name="description"
      content="학교 밖 청소년을 위한 입시·진로 안내. 검정고시 점수로 지원 가능한 대학을 확인하고, 진로 준비를 시작하세요."
    />
    <!-- 링크 공유(카톡·슬랙 등) 미리보기용 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TalkDream — 가까운 꿈드림에 물어봐요" />
    <meta
      property="og:description"
      content="학교 밖 청소년이 가까운 꿈드림센터를 찾고, 선생님께 쪽지로 물어보고, 진학까지 준비하는 앱."
    />
    <!-- og:image는 절대주소여야 미리보기에 뜬다 -->
    <meta property="og:image" content="https://gumgomentor.vercel.app/GumgomentorLOGO.png" />
    <meta property="og:url" content="https://gumgomentor.vercel.app" />
    <meta property="og:locale" content="ko_KR" />
    <!-- 폰트는 src/index.jsx 에서 번들로 불러온다 (CDN 의존 제거, 2026-09) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
